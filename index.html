<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Medicine Alert</title>

    <link rel="stylesheet" href="style.css">
    <button onclick="toggleDarkMode()" class="dark-btn">
    🌙 Dark Mode
</button>
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>💊 Smart Medicine Alert</h1>

        <p>
            Never forget your medicine
        </p>

        <button onclick="toggleDarkMode()" class="dark-btn">
            🌙 Dark Mode
        </button>

    </header>


    <!-- DASHBOARD -->

    <main>

        <section class="dashboard">

            <div class="card">
                <h3>Total Medicines</h3>
                <p id="totalMedicines">0</p>
            </div>

            <div class="card">
                <h3>Today's Medicines</h3>
                <p id="todayMedicines">0</p>
            </div>

            <div class="card">
                <h3>Taken</h3>
                <p id="takenMedicines">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingMedicines">0</p>
            </div>

        </section>


        <!-- PATIENT PROFILE -->

        <section class="box">

            <h2>👤 Patient Profile</h2>

            <input
                type="text"
                id="patientName"
                placeholder="Patient Name">

            <input
                type="number"
                id="patientAge"
                placeholder="Age">

            <button onclick="saveProfile()">
                Save Profile
            </button>

            <p id="profileMessage"></p>

        </section>


        <!-- ADD MEDICINE -->

        <section class="box">

            <h2>💊 Add Medicine</h2>

            <input
                type="text"
                id="medicineName"
                placeholder="Medicine Name">

            <input
                type="text"
                id="dosage"
                placeholder="Dosage e.g. 1 tablet">

            <input
                type="time"
                id="medicineTime">

            <select id="medicinePeriod">

                <option value="Morning">
                    🌅 Morning
                </option>

                <option value="Afternoon">
                    ☀️ Afternoon
                </option>

                <option value="Night">
                    🌙 Night
                </option>

            </select>

            <label>Start Date</label>

            <input
                type="date"
                id="startDate">

            <label>End Date</label>

            <input
                type="date"
                id="endDate">

            <button onclick="addMedicine()">
                ➕ Add Medicine
            </button>

        </section>


        <!-- SEARCH -->

        <section class="box">

            <h2>🔍 Search Medicine</h2>

            <input
                type="text"
                id="searchMedicine"
                placeholder="Search medicine..."
                oninput="displayMedicines()">

        </section>


        <!-- MEDICINE LIST -->

        <section class="box">

            <h2>📋 My Medicines</h2>

            <div id="medicineList"></div>

        </section>


        <!-- HISTORY -->

        <section class="box">

            <h2>📊 Medicine History</h2>

            <div id="historyList"></div>
         <button onclick="clearHistory()">
    🗑️ Clear History
</button>   




        </section>


        <!-- EMERGENCY -->

        <section class="box emergency">

            <h2>🚨 Emergency Contact</h2>

            <input
                type="text"
                id="emergencyName"
                placeholder="Emergency Contact Name">

            <input
                type="tel"
                id="emergencyPhone"
                placeholder="Phone Number">

            <button onclick="saveEmergencyContact()">
                Save Contact
            </button>

            <div id="emergencyDisplay"></div>

        </section>

    </main>


    <!-- NOTIFICATION SOUND -->

    <audio id="alertSound">

        <source
            src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
            type="audio/ogg">

    </audio>


    <script src="script.js"></script>

</body>

</html>
